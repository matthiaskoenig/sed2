name: CI-CD

on:
  push:
    # feature branches are tested through their pull request, tags release
    branches: [develop, main]
    tags: ['*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# least privilege by default, the release and sync jobs raise what they need
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one of the same branch or pull request;
  # a release is never superseded, every tag is a group of its own
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # continuous integration tests the newest python on every platform;
        # linux runs it with the optional dagster and web backends (the `extras`
        # environment, the whole suite with them installed). python 3.13 is
        # tested locally with `tox run-parallel`, see docs/development.md
        include:
          - os: ubuntu-latest
            tox-env: extras
          - os: windows-latest
            tox-env: py3.14
          - os: macos-latest
            tox-env: py3.14

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv and set the python version
      # astral-sh/setup-uv publishes no floating major tag beyond v7
      uses: astral-sh/setup-uv@v10.0.1
      with:
        python-version: "3.14"
        # a release run restores no cache, the package is built without one
        enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
        # the interpreter is cached with the packages instead of downloaded by every run
        cache-python: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
    - name: Test with tox
      env:
        TOX_ENV: ${{ matrix.tox-env }}
      run: uvx --with tox-uv tox -e "${TOX_ENV}" -- --durations=15
      shell: bash

  tests:
    # the one check the branch protection requires; the names of the matrix
    # jobs change with the matrix, this name does not
    name: tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check the result of the test matrix
      env:
        MATRIX: ${{ needs.test.result }}
      run: |
        echo "test matrix: $MATRIX"
        test "$MATRIX" = "success"

  release:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # create the GitHub release
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        python-version: "3.14"
        # a release is built from a clean state, never from a restored cache
        enable-cache: false
    - name: Build package
      # sed2 is a prototype and is not published to pypi; the build runs so
      # that it is known to work, see docs/development.md
      run: uvx hatch build
    - name: Check the package
      run: uvx twine check dist/*
    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        body_path: "release-notes/${{ github.ref_name }}.md"
        files: dist/*
        draft: false
        prerelease: false

  sync-main:
    # main tracks the latest release, see docs/development.md
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main to the released commit
    steps:
    - uses: actions/checkout@v7
      with:
        # a shallow clone cannot be pushed to another branch
        fetch-depth: 0
    - name: Fast-forward main to the release
      # no --force: the push fails loudly if it would not be a fast-forward
      run: git push origin HEAD:main
