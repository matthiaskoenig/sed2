[tox]
envlist = ty, py3.{13,14}, extras

[testenv]
package = wheel
wheel_build_env = .pkg
deps =
    pytest
commands =
    pytest

[testenv:extras]
# the dagster backend and the streamlit app are optional; this is the
# environment which installs them, so that `tests/test_dagster.py` runs
# instead of being skipped
extras =
    dagster
    web
deps =
    pytest
commands =
    pytest

[testenv:ty]
# the optional backends have to resolve for the type check to see their imports
extras =
    dagster
    web
passenv =
    TY_OUTPUT_FORMAT
deps =
    ty
    pytest
commands =
    ty check
